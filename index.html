<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Fuzzy FMEA Mamdani: 5 MF Input, 9 MF Output, 125 Rule</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1d22;--mu:#6b7280;--bd:#e3e5ea;--ac:#2f45e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#e8e9ed;--mu:#9aa0ab;--bd:#2d313a;--ac:#8c9cf5}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#e8e9ed;--mu:#9aa0ab;--bd:#2d313a;--ac:#8c9cf5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:0 0 8px}.h3{font-size:16px;margin:20px 0 8px}
p.s,.note{color:var(--mu);font-size:12.5px;margin:0 0 12px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#tabs button,.bar2 select,.bar2 button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.leg{font-size:11.5px;color:var(--mu);margin-top:6px}.leg div{display:flex;justify-content:space-between;gap:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}.spec b{color:var(--mu);font-weight:500}
.sc{overflow-x:auto}.grids{display:flex;flex-wrap:wrap;gap:12px}
table{border-collapse:separate;border-spacing:2px;font-size:10.5px}
th{font-weight:400;color:var(--mu);font-size:9.5px;max-width:54px;vertical-align:bottom}
td.g{width:36px;height:30px;text-align:center;font-weight:600;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:10px}
.rw{max-height:520px;overflow:auto;margin-top:10px}
table.rt{border-collapse:collapse;border-spacing:0;font-size:12.5px;width:100%}
table.rt th{position:sticky;top:0;background:var(--card);max-width:none;font-size:12px;font-weight:600;color:var(--tx);text-align:left;padding:5px 8px;white-space:nowrap}
table.rt td{padding:3px 8px;border-bottom:1px solid var(--bd)}
.bd{display:inline-block;min-width:34px;text-align:center;padding:1px 8px;border-radius:6px;font-weight:700;font-size:12px}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:12px}
.sl label{font-weight:600}.sl input{width:100%;accent-color:var(--ac)}
.big{margin:6px 0 10px}.big b{font-size:26px}
</style></head><body>
<h1>Fuzzy FMEA Mamdani Tipe-1: 3 Input, 1 Output, 125 Rule</h1>
<p class="s">Input S, O, D masing-masing 5 MF segitiga (model C1–C8 = variasi parameter MF input); output RPN 9 MF. Basis aturan = tabel 125 rule dari pakar.</p>
<div id="tabs"></div><div id="out"></div>
<script>
const P=s=>s.split('|').map(t=>t.split(',').map(Number));
const IN={C1:'0,0,2.5|0,2.5,5|2.5,5,7.5|5,7.5,10|7.5,10,10',C2:'0,0,2|0,2,5|2,5,8|5,8,10|8,10,10',C3:'0,0,3|0,3,5|3,5,7|5,7,10|7,10,10',C4:'0,0,1.5|0,1.5,4|1.5,4,7|4,7,10|7,10,10',C5:'0,0,3|0,3,6|3,6,8.5|6,8.5,10|8.5,10,10',C6:'0,0,2|0,2,4|2,4,7|4,7,10|7,10,10',C7:'0,0,2|1,2.5,4|3,5,7|6,7.5,9|8,10,10',C8:'0,0,1|0,1,3|1,3,6|3,6,10|6,10,10'};
const R=[...Array(9)].map((_,i)=>[Math.max(0,125*(i-1)),125*i,Math.min(1000,125*(i+1))]);
const RN=['EL','VL','L','LM','M','MH','H','VH','EH'];
const RF=['Extremely Low','Very Low','Low','Low-Medium','Medium','Medium-High','High','Very High','Extremely High'];
const RC=['#2f45e8','#6b7af0','#aab4f5','#f1dcdc','#f2b5b5','#ee8f8f','#e85050','#c81e1e','#8b0000'];
const RT=['#fff','#fff','#222','#333','#333','#222','#fff','#fff','#fff'];
const LC=['#2f45e8','#f08a24','#1f9d55','#e03a3a','#9a4df0','#d4a017','#d6479a','#7a5230','#12a5a5'];
const SN=['None','Low','Average','High','Dangerous'],ON=['Nearly Impossible','Low','Average','High','Almost Certain'],DN=['Almost Certain','High','Average','Low','Nearly Impossible'];
/* RPN index 1-9 dari tabel pakar; urutan S(1-5) > O(1-5) > D(1-5) */
const T='1112212233223343344533445'+'4455'+''
+'';
const RB=[
'11122,12233,22334,33445,34455',
'22333,23344,33445,44556,45566',
'33445,34455,45556,55667,56677',
'44556,45566,56677,66778,77788',
'55667,56677,67788,77889,88999'].join(',').split(',').join('').split('').map(Number);
const mu=(x,[a,b,c])=>x<a||x>c?0:x==b?1:x<b?(x-a)/(b-a):(c-x)/(c-b);
const f=v=>String(+v.toFixed(2)).replace('.',',');
const g=id=>document.getElementById(id);
const badge=r=>`<span class="bd" style="background:${RC[r]};color:${RT[r]}">${RN[r]}</span>`;
const idx=(s,o,d)=>RB[s*25+o*5+d]-1;
function chart(sets,names,max,title){const W=400,H=150,l=28,t=8,b=22,w=W-l-8,h=H-t-b,X=v=>l+v/max*w,Y=v=>t+h-v*h;
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">`;
[0,.5,1].forEach(v=>s+=`<line x1="${l}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".15"/><text x="${l-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="currentColor" opacity=".6">${v}</text>`);
for(let i=0;i<=5;i++){const v=max*i/5;s+=`<text x="${X(v)}" y="${H-8}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">${Math.round(v)}</text>`}
sets.forEach(([a,m,c],i)=>{s+=`<polygon points="${X(a)},${Y(0)} ${X(a)},${Y(a==m?1:0)} ${X(m)},${Y(1)} ${X(c)},${Y(c==m?1:0)} ${X(c)},${Y(0)}" fill="${LC[i]}" fill-opacity=".1" stroke="${LC[i]}" stroke-width="1.6"/>`});
return s+'</svg><div class="leg">'+sets.map((q,i)=>`<div><span><i style="background:${LC[i]}"></i>${names[i]}</span><span>[${q.map(f).join('; ')}]</span></div>`).join('')+'</div>'}
function build(k){const I=P(IN[k]);const cnt=Array(9).fill(0);let G='';
for(let d=0;d<5;d++){let t=`<div><b style="font-size:12px">Detection (D) = ${DN[d]}</b><table><tr><th></th>`+ON.map(x=>`<th>${x}</th>`).join('')+'</tr>';
for(let s=4;s>=0;s--){t+=`<tr><th style="text-align:right">${SN[s]}</th>`;for(let o=0;o<5;o++){const r=idx(s,o,d);cnt[r]++;t+=`<td class="g" style="background:${RC[r]};color:${RT[r]}">${RN[r]}</td>`}t+='</tr>'}G+=t+'</table></div>'}
return `<div class="card"><h2>Spesifikasi sistem (mamdanitype1)</h2><div class="spec"><b>Tipe</b><span>Mamdani Type-1</span><b>And method</b><span>prod</span><b>Or method</b><span>max</span><b>Implication</b><span>prod</span><b>Aggregation</b><span>max</span><b>Defuzzifikasi</b><span>centroid</span><b>Input / Output / Rule</b><span>3 / 1 / 125</span><b>MF</b><span>S, O, D = 5 MF; RPN = 9 MF (0–1000)</span></div></div>
<div class="row"><div class="card"><h2>Severity (S)</h2>${chart(I,SN,10,'S')}</div><div class="card"><h2>Occurrence (O)</h2>${chart(I,ON,10,'O')}</div><div class="card"><h2>Detection (D)</h2>${chart(I,DN,10,'D')}</div><div class="card"><h2>RPN (9 himpunan)</h2>${chart(R,RF,1000,'RPN')}</div></div>
<div class="card"><h2>Basis aturan: 5 matriks × 25 sel = 125 rule</h2><p class="s">Kolom: Occurrence, baris: Severity, tiap matriks = satu label Detection.</p><div class="sc"><div class="grids">${G}</div></div>
<div class="chips">${cnt.map((c,i)=>`<span style="background:${RC[i]};color:${RT[i]}">${RN[i]}: ${c}</span>`).join('')}</div></div>`}
const RA=['dapat diterima','sangat kecil','kecil, pantau rutin','rendah-sedang, pertimbangkan perbaikan ringan','sedang, perbaikan terjadwal','cukup tinggi, prioritaskan perbaikan','tinggi, tindakan korektif segera','sangat tinggi, tindakan segera','ekstrem, tindakan segera dan menyeluruh'];
const Ls=[];for(let s=0;s<5;s++)for(let o=0;o<5;o++)for(let d=0;d<5;d++)Ls.push({no:Ls.length+1,s,o,d,r:idx(s,o,d)});
function extra(){return `<h2 class="h3">Daftar lengkap 125 rule</h2><div class="card"><div class="bar2"><label>Filter output RPN: <select id="rf"><option value="">Semua</option>${RF.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></label><button id="cp">Salin sebagai teks</button><span id="rc" class="note"></span></div><div class="rw"><table class="rt"><thead><tr><th>Severity</th><th>Occurrence</th><th>Detection</th><th>RPN</th><th>S</th><th>O</th><th>D</th><th>RPN</th><th>Weight</th></tr></thead><tbody id="rb"></tbody></table></div></div>
<h2 class="h3">Simulasi inferensi (prod, max, centroid)</h2><div class="card"><div class="sl">${['Severity','Occurrence','Detection'].map((x,i)=>`<div><label>${x}: <b id="v${i}">5</b></label><input type="range" id="s${i}" min="0" max="10" step="0.1" value="5"></div>`).join('')}</div><div id="sim"></div></div>`}
const wt=r=>Math.max(0.1,0.1125*r.s+0.0825*r.o+0.055*r.d);
function init(k){const I=P(IN[k]);
const cur=()=>Ls.filter(r=>g('rf').value===''||r.r==g('rf').value);
function draw(){const L=cur();g('rb').innerHTML=L.map(r=>`<tr><td>${SN[r.s]}</td><td>${ON[r.o]}</td><td>${DN[r.d]}</td><td>${badge(r.r)} ${RF[r.r]}</td><td>${r.s+1}</td><td>${r.o+1}</td><td>${r.d+1}</td><td>${r.r+1}</td><td>${wt(r).toFixed(4)}</td></tr>`).join('');g('rc').textContent=`${L.length} dari 125 rule`}
g('rf').onchange=draw;draw();
g('cp').onclick=()=>{const t=cur().map(r=>`R${r.no}: IF Severity = ${SN[r.s]} AND Occurrence = ${ON[r.o]} AND Detection = ${DN[r.d]} THEN RPN = ${RF[r.r]}`).join('\n');
const ok=()=>{g('cp').textContent='Tersalin';setTimeout(()=>g('cp').textContent='Salin sebagai teks',1500)};
const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
function sim(){const x=[0,1,2].map(i=>+g('s'+i).value);x.forEach((v,i)=>g('v'+i).textContent=v);
const mS=I.map(q=>mu(x[0],q)),mO=I.map(q=>mu(x[1],q)),mD=I.map(q=>mu(x[2],q)),act=[];
Ls.forEach(r=>{const w=mS[r.s]*mO[r.o]*mD[r.d];if(w>1e-9)act.push({r,w})});
let num=0,den=0;for(let y=0;y<=1000;y++){let m=0;act.forEach(a=>{const c=a.w*mu(y,R[a.r.r]);if(c>m)m=c});num+=y*m;den+=m}
const cen=den?num/den:0,mm=R.map(q=>mu(cen,q));let lb=0;mm.forEach((v,i)=>{if(v>=mm[lb]-1e-9)lb=i});
g('sim').innerHTML=`<div class="big">FRPN (centroid): <b>${cen.toFixed(1)}</b> &nbsp;|&nbsp; ${act.length} rule aktif &nbsp; ${badge(lb)} ${RF[lb]}</div><div class="rw" style="max-height:260px"><table class="rt"><thead><tr><th>No</th><th>IF Severity</th><th>AND Occurrence</th><th>AND Detection</th><th>THEN RPN</th><th>Firing strength (prod)</th></tr></thead><tbody>${act.map(a=>`<tr><td>R${a.r.no}</td><td>${SN[a.r.s]}</td><td>${ON[a.r.o]}</td><td>${DN[a.r.d]}</td><td>${badge(a.r.r)}</td><td>${a.w.toFixed(3)}</td></tr>`).join('')||'<tr><td colspan="6">Tidak ada rule aktif.</td></tr>'}</tbody></table></div>`}
[0,1,2].forEach(i=>g('s'+i).oninput=sim);sim()}
const tb=g('tabs'),out=g('out');
function show(k){[...tb.children].forEach(x=>x.classList.toggle('on',x.dataset.k==k));out.innerHTML=build(k)+extra();init(k)}
Object.keys(IN).forEach(k=>{const x=document.createElement('button');x.dataset.k=k;x.textContent=k+(k=='C1'?' ⭐':'')+' · 5 set';x.onclick=()=>show(k);tb.appendChild(x)});
show('C1');
</script></body></html>
